[package]
name = "moose-spec-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lint MOOSE test specification (tests) files for SQA metadata, misspelled parameters, and dangling file references"
license = "MIT"
repository = "https://github.com/andrewwhitecdw/moose-spec-lint"
keywords = ["moose", "sqa", "lint", "hit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
